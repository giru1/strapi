name: Build and Deploy to Server

on:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_NAME_STRAPI: ${{ secrets.DOCKERHUB_USERNAME }}/orgma-strapi
  IMAGE_NAME_MINIO: ${{ secrets.DOCKERHUB_USERNAME }}/orgma-minio

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_NAME_STRAPI }}
            ${{ env.IMAGE_NAME_MINIO }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest

      - name: Build and push Strapi image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_NAME_STRAPI }}:latest,${{ env.IMAGE_NAME_STRAPI }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push MinIO image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.minio
          push: true
          tags: ${{ env.IMAGE_NAME_MINIO }}:latest,${{ env.IMAGE_NAME_MINIO }}:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix Git ownership
        run: |
          git config --global --add safe.directory /home/docer/strapi-minio
          git config --global --add safe.directory /home/runner/work/strapi/strapi

      - name: Deploy application
        run: |
          echo "=== Switching to project directory ==="
          cd /home/docer/strapi-minio

          echo "=== Changing remote to HTTPS ==="
          git remote set-url origin https://github.com/giru1/strapi.git

          echo "=== Pulling latest code ==="
          git pull origin main

          echo "=== Deploying ==="
          docker-compose down || true
          docker-compose build --no-cache
          docker-compose up -d
          docker-compose ps